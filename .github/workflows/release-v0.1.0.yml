name: Publish v0.1.0

# Scope this workflow to the one-time initial release addition.
# Future pushes to main do not trigger the release workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.1.0 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.1.0 release already exists; refusing to overwrite it.'
            exit 0
          fi
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'v0.1.0' \
            --notes-file docs/releases/v0.1.0.md
